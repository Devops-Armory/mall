name: CICD Build for mall-admin

on:
  push:
    branches: [ lwflsq-patch-1 ]
    paths:
      - 'mall-admin/**'
      - 'mall-mbg/**'
      - 'mall-security/**'
      - 'mall-common/**'
      - '.github/workflows/cicd-build.yml'
  pull_request:
    branches: [ lwflsq-patch-1 ]
    paths:
      - 'mall-admin/**'
      - 'mall-mbg/**'
      - 'mall-security/**'
      - 'mall-common/**'
      - '.github/workflows/cicd-build.yml'

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 关键步骤：先安装父项目及所有依赖模块到本地仓库
      - name: Install parent and dependent modules
        run: mvn -B clean install -DskipTests --file pom.xml

      # 再构建 mall-admin 模块
      - name: Build mall-admin with Maven
        run: mvn -B clean package -DskipTests --file mall-admin/pom.xml

      - name: Upload mall-admin Jar
        uses: actions/upload-artifact@v4
        with:
          name: mall-admin-lwflsq-build
          path: mall-admin/target/*.jar
