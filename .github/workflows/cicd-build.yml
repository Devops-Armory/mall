name: CICD Build for mall-admin

on:
  push:
    branches: [ lwflsq-patch-1 ]  # 改为目标分支
    paths:
      - 'mall-admin/**'
      - '.github/workflows/cicd-build.yml'
  pull_request:
    branches: [ lwflsq-patch-1 ]  # 改为目标分支
    paths:
      - 'mall-admin/**'
      - '.github/workflows/cicd-build.yml'

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build mall-admin with Maven
        run: mvn -B clean package --file mall-admin/pom.xml

      - name: Upload mall-admin Jar
        uses: actions/upload-artifact@v4  # 使用最新版本避免弃用警告
        with:
          name: mall-admin-lwflsq-build
          path: mall-admin/target/*.jar

      # （可选）构建Docker镜像
      - name: Build Docker image
        run: docker build -t mall-admin:lwflsq-patch-1 --build-arg SERVICE_NAME=mall-admin .
