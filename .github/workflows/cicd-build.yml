name: CICD Build for mall-admin

# 触发条件：针对cicd分支的推送和PR
on:
  push:
    branches: [ lwflsq-patch-1 ]
    paths:
      - 'mall-admin/**'
      - '.github/workflows/cicd-build.yml'
  pull_request:
    branches: [ lwflsq-patch-1 ]
    paths:
      - 'mall-admin/**'
      - '.github/workflows/cicd-build.yml'

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 配置JDK 8（项目依赖Java 8）
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 使用Maven构建mall-admin模块
      - name: Build mall-admin with Maven
        run: mvn -B clean package --file mall-admin/pom.xml

      # 上传构建产物（Jar包）
      - name: Upload mall-admin Jar
        uses: actions/upload-artifact@v3
        with:
          name: mall-admin-cicd-build
          path: mall-admin/target/*.jar
