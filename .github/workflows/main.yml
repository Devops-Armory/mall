name: mall CI/CD
run-name: buld and push
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-backend:
    name: Build & Test Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run Unit Tests
        run: mvn test

  build-frontend:
    name: Build mall-admin-web Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mall-admin-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: mall-admin-web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('mall-admin-web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run lint
        run: npm run lint

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mall-admin image
        run: |
          docker build --build-arg SERVICE_NAME=mall-admin -t ${{ secrets.DOCKERHUB_USERNAME }}/mall-admin:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mall-admin:latest

      - name: Build and push mall-portal image
        run: |
          docker build --build-arg SERVICE_NAME=mall-portal -t ${{ secrets.DOCKERHUB_USERNAME }}/mall-portal:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mall-portal:latest

      - name: Build and push mall-search image
        run: |
          docker build --build-arg SERVICE_NAME=mall-search -t ${{ secrets.DOCKERHUB_USERNAME }}/mall-search:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mall-search:latest

      - name: Build and push mall-admin-web image
        run: |
          cd mall-admin-web
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mall-admin-web:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mall-admin-
